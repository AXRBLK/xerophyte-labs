<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xerophyte Labs</title>
<link rel="icon" id="favicon" type="image/png" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed painted desert desktop, icon columns on both edges, draggable Win95 windows, taskbar pinned bottom. Dusk palette by day, moonlit palette (body.night) after 7pm local. */
:root{
  color-scheme: dark;
  --dusk:#2c2638;        /* deep sky / page ground */
  --sand:#e4d0b4;        /* light text on paint */
  --sun:#c98c70;         /* accent */
  --bloom:#c0607a;       /* prickly-pear flower pink, alerts */
  --sage:#8aa078;        /* cactus green, healthy */
  --chrome:#c7bdb4;      /* window chrome (warm Win95 grey) */
  --chrome-hi:#f4eee8;
  --chrome-lo:#6d625b;
  --ink:#1c1218;
  --paper:#fbf6ef;
  --title-a:#5e4a5c; --title-b:#a8785e;
  --link:#5e4a5c; --card:#ffffff; --line:#d9cbbd; --line2:#eadfd3; --mute:#6d5a52; --ink2:#4a3a36; --band:#f1e2d4;
  --font-display:"Silkscreen","Pixelify Sans","Courier New",monospace;
  --font-ui:"Pixelify Sans","Tahoma","Verdana",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"Menlo",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--dusk);color:var(--sand);font-family:var(--font-data);font-size:14px;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

/* marquee */
.marquee{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));border:2px solid var(--sand);overflow:hidden;white-space:nowrap;z-index:2;background:rgba(42,20,51,.12)}
.marquee .track{display:inline-block;padding:6px 0;font-family:var(--font-ui);font-size:17px;animation:scroll 60s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* hero title */
.hero{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;pointer-events:none;z-index:1}
.hero h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:28.8px;line-height:1.15;letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never;color:#f4ece0;text-shadow:2px 2px 0 rgba(40,36,58,.6)}
.hero h1 span{display:block}
.hero h1{position:relative}
/* load: a block cursor types the title, then the tagline flickers on in neon */
.hero h1 .ch{font-style:normal;white-space:pre}
.hero h1.typing .ch{visibility:hidden}
.hero h1.typing .ch.on{visibility:visible}
.hero h1.typing .ch.caret{visibility:visible;color:transparent;background:#f4ece0;text-shadow:none;box-shadow:2px 2px 0 rgba(40,36,58,.6)}
.hero h1.typing .cursor{visibility:hidden}
.hero h1 .cursor{display:inline-block;width:.5em;height:.82em;margin-left:.18em;vertical-align:-.04em;background:currentColor;box-shadow:2px 2px 0 rgba(40,36,58,.6);animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero .sub.neon{animation:neon 2.4s steps(1,end) 1 both}
@keyframes neon{
  0%,6%,12%{color:#7dff7a;text-shadow:0 0 3px #39ff3a,0 0 9px #39ff3a;background:rgba(8,20,10,.88)}
  3%,9%{color:#2e6a2e;text-shadow:none}
  70%{color:#7dff7a;text-shadow:0 0 3px #39ff3a,0 0 9px #39ff3a;background:rgba(8,20,10,.88)}
}
.hero .sub{transition:color .6s,text-shadow .6s,background-color .6s}
body.still .hero h1 .cursor{animation:none}
.hero .sub,.hero .live{display:inline-block;padding:2px 8px;background:rgba(40,36,58,.7);font-family:var(--font-ui);font-size:13.2px;letter-spacing:.08em;text-transform:uppercase;color:#efe2cc}
.hero .live{text-transform:none;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hero .live{display:inline-flex;align-items:center;gap:8px}.hero .live .wx{width:26px;height:26px;image-rendering:pixelated;image-rendering:crisp-edges;margin:-3px 0}

/* icons */
.icons{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));bottom:56px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;z-index:3;align-content:flex-start}
.icons.left{left:10px}.icons.right{right:10px;align-content:flex-end}
.icon{width:88px;padding:6px 2px;border:1px dotted transparent;background:none;color:#fff;font-family:var(--font-ui);font-size:14px;line-height:1.15;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.icon img{width:48px;height:48px;image-rendering:pixelated}
.icon:hover span,.icon:focus-visible span{background:var(--title-a)}
.icon:focus-visible{outline:none;border-color:#fff}
.icon .badge{position:relative}
.icon .badge i{position:absolute;right:-8px;top:-6px;font-style:normal;background:var(--bloom);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;border:1px solid #fff}

/* windows */
.win{position:fixed;min-width:280px;max-width:calc(100vw - 32px);max-height:calc(100% - 110px);display:flex;flex-direction:column;background:var(--chrome);color:var(--ink);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);box-shadow:1px 1px 0 #000,6px 8px 0 rgba(28,18,24,.35);z-index:10;font-family:var(--font-ui)}
.win[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;background:linear-gradient(90deg,var(--chrome-lo),#9b908a);color:var(--chrome-hi);cursor:grab;user-select:none;touch-action:none}
.win.active .bar{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:#fff}
.bar img{width:16px;height:16px;image-rendering:auto}
.bar b{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:22px;height:20px;padding:0;font:600 13px/1 var(--font-ui);background:var(--chrome);color:var(--ink);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);cursor:pointer}
.bar button:active{border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo)}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:13px;border-bottom:1px solid var(--chrome-lo)}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.body{margin:6px;flex:1;overflow:auto;background:var(--paper);border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);padding:14px;font-family:var(--font-data);font-size:13px;line-height:1.55;min-height:0}
.status{display:flex;gap:4px;padding:0 6px 5px;font-size:12px}
.status span{flex:1;padding:1px 6px;border:1px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body p{margin:0 0 .9em;max-width:62ch}
.body a{color:var(--link)}
.body h3{font-family:var(--font-ui);font-weight:600;font-size:15px;margin:0 0 8px}

/* cacti */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-family:var(--font-ui)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--ink);font-family:var(--font-ui);font-size:12px;white-space:nowrap}
.chip.thirsty{background:var(--bloom);color:#fff;border-color:#8a1f45}
.chip.soon{background:#e8d29c;color:#1c1218}
.chip.fine{background:#d4dfc8;color:#1c1218}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.cactus{display:grid;grid-template-columns:48px 1fr;gap:4px 10px;padding:10px;background:var(--card);border:1px solid var(--line);min-width:0}
.cactus img.sp{width:48px;height:48px;image-rendering:pixelated;grid-row:span 3;object-fit:cover}
.cactus .nm{font-family:var(--font-ui);font-weight:600;font-size:16px;line-height:1.1;display:flex;justify-content:space-between;gap:6px;align-items:start}
.cactus .sci{font-style:italic;color:var(--mute);font-size:12px;line-height:1.3}
.cactus .meta{font-size:12px;color:var(--ink2)}
.meter{grid-column:1/-1;height:10px;border:1px solid var(--ink);background:repeating-linear-gradient(90deg,var(--line2) 0 9px,var(--line) 9px 10px);margin-top:4px}
.meter i{display:block;height:100%;background:var(--sage)}
.meter i.soon{background:#d4b064}.meter i.thirsty{background:var(--bloom)}
.cactus .note{grid-column:1/-1;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}

/* weather */
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.now .big{font-family:var(--font-display);font-size:48px;-webkit-font-smoothing:none;line-height:1;color:var(--link);font-variant-numeric:tabular-nums}
.now .cond{font-family:var(--font-ui);font-size:18px}
.now dl{display:grid;grid-template-columns:auto auto;gap:0 12px;margin:6px 0 0;font-size:12px}
.now dt{color:var(--mute)}.now dd{margin:0;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.day{border:1px solid var(--line);background:var(--card);padding:6px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.day b{display:block;font-family:var(--font-ui);font-weight:600;font-size:13px}
.day small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line)}
.chart .grid-l{stroke:var(--line2);stroke-width:1}
.chart .hi{fill:none;stroke:var(--title-b);stroke-width:2.5}
.chart .lo{fill:none;stroke:#6a6488;stroke-width:2;stroke-dasharray:5 3}
.chart .band{fill:var(--band)}
.chart .rain{fill:#7f97b4}
.chart text{fill:var(--mute);font:11px var(--font-data)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin:8px 0 12px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th{font-family:var(--font-ui);font-weight:600;text-align:left;background:var(--chrome);border:1px solid var(--chrome-lo);padding:3px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line2);padding:4px 6px;white-space:nowrap}
td.n{text-align:right}
td.wrap{white-space:normal;min-width:140px}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(28,18,24,.62);border-top:1px solid rgba(243,201,160,.6);z-index:50;font-family:var(--font-ui)}
.start{padding:4px 14px;font:600 15px var(--font-ui);color:#fff;background:transparent;border:1px solid var(--sand);cursor:pointer}
.start[aria-expanded="true"]{background:var(--title-a)}
.tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.task{max-width:160px;padding:4px 10px;color:var(--sand);background:transparent;border:1px solid rgba(243,201,160,.45);font:13px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.task.on{background:rgba(243,201,160,.18);border-color:var(--sand);color:#fff}
.tray{display:flex;gap:16px;padding:4px 12px;border:1px solid rgba(243,201,160,.45);font-size:13px;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.startmenu .adm{display:none}body.admin .startmenu .adm{display:block}
.startmenu .chk{margin-left:auto;padding-left:8px;font-weight:700}.startmenu .chk.ok{color:#2f8a3a}.startmenu .chk.warn{color:#b07a18}.startmenu .chk.off{color:#a83a2a}
body.night .startmenu .chk.ok{color:#6ade74}body.night .startmenu .chk.warn{color:#f0b84a}body.night .startmenu .chk.off{color:#ff7a66}
.startmenu li button:hover .chk,.startmenu li button:focus-visible .chk{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:6px 12px;background:#000;color:#00e000;border:2px solid #6a6a86;font:12px var(--font-display);-webkit-font-smoothing:none;pointer-events:none}
#toast.show{animation:toastIn .2s steps(3)}@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}}
.startmenu{position:fixed;left:4px;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:240px;display:flex;background:var(--chrome);color:var(--ink);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);z-index:60;font-family:var(--font-ui)}
.startmenu[hidden]{display:none!important}
.startmenu .side{width:28px;background:linear-gradient(0deg,var(--title-a),var(--title-b));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;padding:8px 0;letter-spacing:.06em}
.startmenu ul{list-style:none;margin:0;padding:4px;flex:1}
.startmenu li button,.startmenu li a{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;font:14px var(--font-ui);color:var(--ink);background:none;border:0;text-align:left;cursor:pointer;text-decoration:none}
.startmenu li button:hover,.startmenu li a:hover,.startmenu li button:focus-visible{background:var(--title-a);color:#fff;outline:none}
.startmenu li img{width:18px;height:18px;image-rendering:auto}
.startmenu hr{border:0;border-top:1px solid var(--chrome-lo);border-bottom:1px solid var(--chrome-hi);margin:3px 0}

.muted{color:var(--mute)}
.example{display:inline-block;font-size:11px;padding:0 6px;border:1px dashed var(--mute);color:var(--mute);margin-bottom:10px}

/* Xerophyte FM player */
.win .body.amp-body{background:var(--chrome);border:0;padding:4px 2px;margin:4px 6px 6px}
.amp{display:flex;flex-direction:column;gap:8px}
.lcd{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end;padding:8px 10px;background:#1d2119;color:#b9d79c;border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);font-family:var(--font-display);-webkit-font-smoothing:none;min-width:0}
.lcd-top{display:flex;flex-direction:column;gap:4px;min-width:0}
.lcd-state{font-size:8px;color:#d9b46a;letter-spacing:.1em}
.lcd-time{font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.viz{width:114px;height:48px;image-rendering:pixelated;max-width:100%}
.lcd-scroll{grid-column:1/-1;overflow:hidden;white-space:nowrap;font-size:16px;line-height:1;border-top:1px solid #2f3628;padding-top:6px}
.lcd-scroll span{display:inline-block;animation:scroll 22s linear infinite}
.seek{height:12px;background:repeating-linear-gradient(90deg,#d8cfc4 0 7px,#c4b9ad 7px 8px);border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);cursor:pointer}
.seek i{display:block;height:100%;width:0;background:var(--title-b)}
.seek:focus-visible{outline:1px dotted var(--ink);outline-offset:2px}
.amp-btns{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.amp-btns button{min-width:36px;height:26px;padding:0 6px;font:600 13px var(--font-ui);color:var(--ink);background:var(--chrome);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);cursor:pointer}
.amp-btns button:active{border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo)}
.amp-btns button:disabled{color:var(--chrome-lo);cursor:default}
.amp-btns button:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}
.amp-open{margin-left:auto;font:13px var(--font-ui);color:var(--link)}
.deck{padding:4px;background:#1d2119;border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo)}
.deck iframe{display:block;border:0;border-radius:10px}
.tape-empty{padding:12px;background:var(--paper);font:12px/1.5 var(--font-data);color:var(--ink2)}

/* Desert Map */
.win .body.map-body{padding:0;display:flex;flex-direction:column;overflow:auto}
.maptools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;background:var(--chrome);border-bottom:1px solid var(--chrome-lo);font-family:var(--font-ui)}
.maptools button{height:24px;padding:0 8px;font:13px var(--font-ui);color:var(--ink);background:var(--chrome);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);cursor:pointer;white-space:nowrap}
.maptools button[aria-pressed="true"],.maptools button:active{border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);background:var(--paper)}
.maptools button:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}
.maptools .sep{width:1px;height:20px;background:var(--chrome-lo)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;min-height:0}
.mapwrap{position:relative;height:440px;overflow:hidden;cursor:grab;touch-action:none;background:#b8a684;outline:none;min-width:0}
.mapwrap.grabbing{cursor:grabbing}
.mapwrap:focus-visible{box-shadow:inset 0 0 0 2px var(--link)}
.mapcv,.maplabels,.mapnight,.mapmarks{position:absolute;inset:0;width:100%;height:100%}
.mapcv{image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(.78) sepia(.14) contrast(1.03)}
.maplabels,.mapnight,.mapmarks{pointer-events:none}
.mapnight{background:#141c48;mix-blend-mode:multiply;opacity:0}
body.night .mapnight{opacity:.55}
body.night .mapcv{filter:saturate(.5) brightness(.8)}
.mk{position:absolute;left:0;top:0;margin:-24px 0 0 -12px;display:flex;align-items:flex-end;gap:2px;padding:0;background:none;border:0;cursor:pointer;pointer-events:auto}
.mk img{width:24px;height:24px;image-rendering:pixelated;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}
.mk.home img{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6)) drop-shadow(0 0 2px #ffe48a)}
.mk b{font:600 11px var(--font-ui);color:#1c1218;background:#f4ece0;border:1px solid #1c1218;padding:0 3px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.mk.sel{z-index:2}
.mk.sel b{background:#e6c868}
.mk .nm{font:600 11px var(--font-ui);color:#fbf4e6;text-shadow:1px 0 0 #1c1218,-1px 0 0 #1c1218,0 1px 0 #1c1218,0 -1px 0 #1c1218;margin:0 0 3px 2px;white-space:nowrap}
.mk.nolabel .nm{display:none}
.mk.sel .nm{color:#ffe48a}
.mk:focus-visible b{outline:2px solid #e6c868;outline-offset:1px}
.mapattr{position:absolute;right:0;bottom:0;padding:1px 6px;font:10px var(--font-data);color:#1c1218;background:rgba(244,236,224,.75);pointer-events:none}
.mapwrap.tuning::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.2) 0 1px,rgba(0,0,0,.3) 1px 3px);animation:tune .34s steps(5) forwards}
@keyframes tune{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}
.mapside{display:flex;flex-direction:column;min-height:0;max-height:440px;border-left:2px solid var(--chrome-lo);background:var(--paper);min-width:0}
.pl-info{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}
.pl-info h3{margin:0;font-family:var(--font-ui);font-size:16px;font-weight:600}
.pl-region{color:var(--mute);font-size:11px;margin-top:2px}
.pl-now{display:flex;gap:10px;align-items:center;margin:8px 0 6px}
.pl-now b{font-family:var(--font-display);font-size:28px;font-weight:400;color:var(--link);line-height:1;-webkit-font-smoothing:none}
.pl-now span{font-size:11px;line-height:1.45}
.pl-info p{margin:0;font-size:12px;line-height:1.45}
.places{list-style:none;margin:0;padding:4px;overflow:auto;flex:1}
.places button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;background:none;border:1px solid transparent;color:var(--ink);font:13px var(--font-ui);text-align:left;cursor:pointer}
.places button small{display:block;font-size:10px;color:var(--mute)}
.places button i{font-style:normal;font-family:var(--font-data);font-size:12px;font-variant-numeric:tabular-nums}
.places button:hover{border-color:var(--line)}
.places button:focus-visible{outline:1px dotted var(--ink)}
.places button[aria-pressed="true"]{background:var(--title-a);color:#fff}

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;else if(ch==","){row.push(f);f=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch;}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function toObjects(rows){
  if(!rows.length)return[];
  const h=rows[0].map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])));
}

function cactusState(c){
  const last=toDate(c.last_watered),every=num(c.water_every_days)||14;
  const since=last?daysBetween(last,today()):null;
  const left=since==null?null:every-since;
  const status=since==null?"fine":left<=0?"thirsty":left<=2?"soon":"fine";
  const pct=since==null?100:Math.max(0,Math.min(100,Math.round(100*(1-since/every))));
  return {since,every,left,status,pct};
}

/* ---------- live weather (Open-Meteo, free, no key) ---------- */
/* pixel weather icon for the live line: drawn from the Open-Meteo weather code */
const WX_ART={
  sun:[".....y.....",".y.......y.","....yyy....","...yYYYy...","..yYYYYYy..","y.yYYYYYy.y","..yYYYYYy..","...yYYYy...","....yyy....",".y.......y.",".....y....."],
  moon:["...........","....mmm....","...mmM.....","..mmM......","..mmM......","..mmM......","..mmmM.....","...mmmmm.m.","....mmmmm..","...........","..........."],
  cloud:["....ccc....","...cccccc..",".cccccccc..","cccccccccc.","cccccccccc.",".CCCCCCCC.."],
  dark:["....ddd....","...dddddd..",".dddddddd..","dddddddddd.","dddddddddd.",".DDDDDDDD.."],
  fog:["..........","ffffffff..","..........","..ffffffff","..........","ffffffff..","..........","..ffffffff"],
  rain:["b...b...b.","..........",".b...b...b"],
  snow:["w...w...w.","..........",".w...w...w"],
  bolt:["...z","..z.",".zzz","..z.",".z.."]
};
const WX_PAL={y:"#f2c84a",Y:"#fae49a",m:"#ece6c4",M:"#b8b292",c:"#f0eef4",C:"#a8a8bc",d:"#8c8ca4",D:"#5c5c74",f:"#d8d4dc",b:"#6aa8e8",w:"#ffffff",z:"#ffd84a"};
const wxCache={};
function wxIcon(code,night){
  code=+code||0;const key=code+(night?"n":"d");if(wxCache[key])return wxCache[key];
  const cv=document.createElement("canvas");cv.width=cv.height=13;const c=cv.getContext("2d");
  const put=(art,ox,oy)=>art.forEach((r,y)=>[...r].forEach((ch,x)=>{if(WX_PAL[ch]){c.fillStyle=WX_PAL[ch];c.fillRect(ox+x,oy+y,1,1)}}));
  const sky=night?WX_ART.moon:WX_ART.sun;
  if(code<=1)put(sky,1,1);                                        // clear
  else if(code===2){put(sky,0,0);put(WX_ART.cloud,2,6)}           // partly cloudy
  else if(code===3)put(WX_ART.cloud,1,4);                         // overcast
  else if(code===45||code===48)put(WX_ART.fog,1,2);               // fog
  else if(code>=95){put(WX_ART.dark,1,1);put(WX_ART.bolt,4,7)}    // thunder
  else if((code>=71&&code<=77)||code===85||code===86){put(WX_ART.cloud,1,1);put(WX_ART.snow,1,8)}
  else {put(code>=63&&code!==80?WX_ART.dark:WX_ART.cloud,1,1);put(WX_ART.rain,1,8)}  // drizzle, rain, showers
  return wxCache[key]=cv.toDataURL();
}
const WMO={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Showers",81:"Showers",82:"Downpour",95:"Thunderstorm",96:"Hail storm",99:"Hail storm"};

/* ---------- window manager ---------- */
const WINS={};let Z=20,openOrder=0;
function defineWindow(id,{title,icon,w,x,y,render,menu,status}){
  const el=document.createElement("section");el.className="win";el.hidden=true;el.id="w-"+id;
  el.setAttribute("role","dialog");el.setAttribute("aria-label",title);
  el.style.width=w+"px";
  el.innerHTML=`<div class="bar"><img alt="" src="${sprite(icon)}"><b>${esc(title)}</b><button data-a="min" aria-label="Minimize">_</button><button data-a="close" aria-label="Close">×</button></div>
  ${menu?`<div class="menu">${menu.map(m=>`<span><u>${m[0]}</u>${m.slice(1)}</span>`).join("")}</div>`:""}
  <div class="body"></div>${status?`<div class="status"></div>`:""}`;
  document.getElementById("windows").appendChild(el);
  WINS[id]={el,title,icon,x,y,render,status,placed:false};
  el.addEventListener("pointerdown",()=>focusWin(id));
  // close on click, and straight away on a finger lift so touch screens never miss it
  const cb=el.querySelector("[data-a=close]");
  cb.onclick=e=>{e.stopPropagation();if(W0().open)closeWin(id)};
  // touchend + preventDefault also cancels the follow-up "ghost" click, which would otherwise land on whatever was under the window
  cb.addEventListener("touchend",e=>{e.preventDefault();e.stopPropagation();if(W0().open)closeWin(id)},{passive:false});
  const W0=()=>WINS[id];
  el.querySelector("[data-a=min]").onclick=e=>{e.stopPropagation();shrinkWin(id)};
  drag(el,el.querySelector(".bar"));
}
// minimize with a quick shrink toward the window's taskbar button
function shrinkWin(id){
  const W=WINS[id],el=W.el;if(!W.open||W.min)return;
  let btn=[...document.querySelectorAll("#tasks .task")].find(b=>b.textContent===W.title)||document.getElementById("tasks");
  if(id==="radio"){const m=document.getElementById("miniamp");if(m){m.hidden=false;m.style.visibility="hidden";btn=m;requestAnimationFrame(()=>m.style.visibility="")}}
  if(!el.animate||document.body.classList.contains("still")||!btn){minWin(id);return}
  const a=el.getBoundingClientRect(),b=btn.getBoundingClientRect();
  const sc=Math.max(.06,b.width/a.width),dx=b.left-a.left,dy=b.top-a.top;
  el.style.transformOrigin="0 0";
  const an=el.animate([{transform:"none",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${sc})`,opacity:.25}],{duration:380,easing:"cubic-bezier(.5,0,.9,.6)"});
  an.onfinish=()=>{minWin(id);el.style.transformOrigin=""};
}
function minWin(id){
  const W=WINS[id];W.min=true;
  if(id==="radio")W.el.classList.add("stowed"); // keep the Spotify player running while tucked away
  else W.el.hidden=true;
  renderTasks();
}
function openWin(id){
  const W=WINS[id];if(!W)return;W.el.classList.remove("stowed");
  W.render(W.el.querySelector(".body"),W.el.querySelector(".status"));
  if(!W.placed){
    const off=(openOrder++%5)*22;
    const ww=Math.min(W.el.offsetWidth||parseInt(W.el.style.width),innerWidth-32);
    W.el.style.left=Math.max(16,Math.min(innerWidth-ww-16,(W.x??(innerWidth-ww)/2)+off))+"px";
    W.el.style.top=Math.max(60,(W.y??90)+off)+"px";W.placed=true;
  }
  W.el.hidden=false;W.open=true;W.min=false;focusWin(id);renderTasks();
}
function closeWin(id){if(id==="radio"&&SPOT.ctl){try{SPOT.ctl.pause()}catch(e){}}const W=WINS[id];W.el.hidden=true;W.open=false;W.min=false;renderTasks()}
function focusWin(id){
  Object.values(WINS).forEach(w=>w.el.classList.remove("active"));
  const W=WINS[id];W.el.style.zIndex=++Z;W.el.classList.add("active");renderTasks(id);
}
function drag(el,handle){
  let sx,sy,ox,oy,on=false;
  handle.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||innerWidth<=700)return;
    on=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;handle.setPointerCapture(e.pointerId);handle.style.cursor="grabbing";
  });
  handle.addEventListener("pointermove",e=>{if(!on)return;
    el.style.left=Math.max(-el.offsetWidth+80,Math.min(innerWidth-80,ox+e.clientX-sx))+"px";
    el.style.top=Math.max(44,Math.min(innerHeight-90,oy+e.clientY-sy))+"px";});
  const end=()=>{on=false;handle.style.cursor=""};
  handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
}
function renderTasks(active){
  const t=document.getElementById("tasks");t.innerHTML="";
  const act=active||Object.keys(WINS).find(k=>WINS[k].el.classList.contains("active"));
  Object.entries(WINS).filter(([,w])=>w.open).forEach(([id,w])=>{
    const b=document.createElement("button");b.className="task"+(id===act&&!w.min?" on":"");b.textContent=w.title;
    b.onclick=()=>{if(w.min||id!==act){w.min=false;w.el.hidden=false;w.el.classList.remove("stowed");focusWin(id)}else minWin(id)};
    t.appendChild(b);
  });
  updateMini();
}

/* ---------- Xerophyte FM: retro skin around a Spotify embed ---------- */
// the player's name everywhere (icon, window, Start menu, LCD) comes from Settings › radio_title
const radioName=()=>String(SET.radio_title||"").trim()||"Xerophyte FM";
/* now playing: Spotify's embed only reports the track's URI, so the song title comes from
   Spotify's public oEmbed and the artist from an iTunes search matched on title and length */
// the skin's maker stamp: the radio name with its last word picked out, e.g. CHOLLA HUGGER RADIO
const ampBrand=t=>{const w=String(t).trim().split(/\s+/);const last=w.length>1?w.pop():"";return esc(w.join(" "))+(last?` <b>${esc(last)}</b>`:"")};
const NOW={uri:null,title:"",artist:"",started:false};
function lookupTrack(uri,dur){
  const m=String(uri||"").match(/^spotify:(track|episode):([A-Za-z0-9]+)$/);if(!m||uri===NOW.uri)return;
  NOW.uri=uri;NOW.title=NOW.artist="";ampText();
  fetch(`https://open.spotify.com/oembed?url=https://open.spotify.com/${m[1]}/${m[2]}`).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||NOW.uri!==uri)return;NOW.title=String(j.title||"").trim();ampText();
    if(NOW.title&&m[1]==="track")findArtist(NOW.title,dur).then(a=>{if(NOW.uri===uri&&a){NOW.artist=a;ampText()}});
  }).catch(()=>{});
}
function findArtist(title,dur){
  return new Promise(res=>{
    const cb="itcb"+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement("script");
    const done=a=>{delete window[cb];sc.remove();res(a)};
    const norm=t=>String(t).toLowerCase().replace(/\s*[-(\[].*(remaster|version|edit|mix|live|feat|mono|stereo).*$/,"").replace(/[^a-z0-9]+/g," ").trim();
    window[cb]=d=>{const want=norm(title),hits=(d&&d.results||[]).filter(r=>norm(r.trackName)===want);
      // full-length plays must match the track length; 30-second previews fall back to the top match
      const full=dur>35000,pick=full?hits.find(r=>Math.abs((r.trackTimeMillis||0)-dur)<3000):hits[0];
      done(pick?pick.artistName:"")};
    sc.src=`https://itunes.apple.com/search?term=${encodeURIComponent(title)}&entity=song&limit=50&callback=${cb}`;
    sc.onerror=()=>done("");document.head.appendChild(sc);setTimeout(()=>window[cb]&&done(""),6000);
  });
}
function nowLine(){if(!NOW.started||!NOW.title)return "";return (NOW.artist?NOW.artist+" - ":"")+NOW.title}

const SPOT={api:null,ctl:null,loading:false,src:null,viz:null,state:{paused:true,pos:0,dur:0}};
function spotifySrc(v){

function loadSpotify(src){
  const fallback=()=>{
    const host=document.getElementById("spotHost");if(!host||SPOT.ctl)return;
    host.outerHTML=`<iframe title="Spotify player" src="https://open.spotify.com/embed/${src.type}/${src.id}?theme=0" width="100%" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" style="border:0;display:block"></iframe>`;
    const st=document.getElementById("ampState");if(st)st.textContent="USE DECK";
  };

    const host=document.getElementById("spotHost");if(!host)return;
    SPOT.api.createController(host,{uri:src.uri,width:"100%",height:152},ctl=>{
      SPOT.ctl=ctl;
      if(SPOT.autoplay){SPOT.autoplay=false;ctl.addListener("ready",()=>kickPlay());kickPlay()}
      ctl.addListener("playback_update",e=>{const d=e.data||{};
        SPOT.state={paused:!!d.isPaused,pos:d.position||0,dur:d.duration||0,buffering:!!d.isBuffering};SPOT.at=performance.now();
        if(!d.isPaused){SPOT.stopped=false;NOW.started=true}
        if(d.playingURI)lookupTrack(d.playingURI,d.duration||0);ampUpdate()});
    });
  };
  if(SPOT.api){mount();return}

  clearTimeout(SPOT.fail);SPOT.fail=setTimeout(()=>{if(!SPOT.api)fallback()},7000);
  SPOT.onfail=fallback;
}
function preloadSpotify(){

  sc.onerror=()=>{SPOT.loading=false;SPOT.onfail&&SPOT.onfail()};document.head.appendChild(sc);
}
// ask Spotify to play, and keep asking for a few seconds: the embed ignores play() until its track has loaded
function kickPlay(){
  clearInterval(SPOT.kick);let n=0;
  const go=()=>{const C=SPOT.ctl;if(!C)return;
    if(n++>12||(!SPOT.state.paused&&!SPOT.stopped&&SPOT.state.pos>0)){clearInterval(SPOT.kick);return}
    try{SPOT.state.pos>0&&!SPOT.stopped?C.resume():C.play()}catch(e){}};
  go();SPOT.kick=setInterval(go,700);
}

  pause(){SPOT.ctl&&SPOT.ctl.pause()},

}

function renderToday(body,status){
  const F=(SET.units||"F").toUpperCase().startsWith("F"),U=F?"°F":"°C";
  const loc=esc(SET.location_name||"");
  if(LIVE&&LIVE.current){
    const c=LIVE.current,d=LIVE.daily;
    body.innerHTML=`<div class="now">
      <div class="big">${Math.round(c.temperature_2m)}°</div>
      <div><div class="cond">${WMO[c.weather_code]??"—"}</div>
        <dl><dt>Feels like</dt><dd>${Math.round(c.apparent_temperature)}${U}</dd>
        <dt>Humidity</dt><dd>${c.relative_humidity_2m}%</dd>
        <dt>Wind</dt><dd>${Math.round(c.wind_speed_10m)} ${F?"mph":"km/h"}</dd>
        <dt>UV max</dt><dd>${d.uv_index_max?.[0]??"—"}</dd></dl></div></div>
      <div class="days">${d.time.map((t,i)=>{const dt=toDate(t);return `<div class="day"><b>${i?dt.toLocaleDateString(undefined,{weekday:"short"}):"Today"}</b>
        ${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°<small>${WMO[d.weather_code[i]]??""}</small><small>${d.precipitation_probability_max?.[i]??0}% rain</small></div>`}).join("")}</div>`;
    status.innerHTML=`<span>${loc}</span><span>Live · Open-Meteo</span>`;
  }else{
    const rows=weatherRows(),last=rows[rows.length-1];
    body.innerHTML=last?`${exampleTag()}<div class="now"><div class="big">${Math.round(last.high)}°</div>
      <div><div class="cond">${esc(last.conditions||"—")}</div><dl><dt>High</dt><dd>${last.high}${U}</dd><dt>Low</dt><dd>${last.low}${U}</dd><dt>Rain</dt><dd>${last.rain}"</dd><dt>Logged</dt><dd>${fmtDate(last.d)}</dd></dl></div></div>
      <p class="muted" style="margin-top:12px">Live conditions are unavailable right now, so this shows the latest row from the weather log.</p>`:`<p>No weather logged yet. Add a row to the Weather tab.</p>`;
    status.innerHTML=`<span>${loc}</span><span>From log</span>`;
  }
}

function weatherRows(){
  const sheet=(DATA.weather||[]).map(r=>({...r,d:toDate(r.date),high:num(r.high),low:num(r.low),rain:num(r.rain)??0})).filter(r=>r.d);
  if(!HIST)return sheet.filter(r=>r.high!=null).sort((a,b)=>a.d-b.d);
  // live observations win; the sheet adds notes and any older days
  const by=new Map(HIST.map(r=>[+r.d,{...r}]));
  sheet.forEach(r=>{const l=by.get(+r.d);if(l){if(r.notes)l.notes=r.notes}else if(r.high!=null)by.set(+r.d,r)});
  return [...by.values()].sort((a,b)=>a.d-b.d);
}
let HIST=null;
async function loadHistory(){
  const lat=num(SET.latitude),lon=num(SET.longitude);if(lat==null||lon==null)return null;
  const F=(SET.units||"F").toUpperCase().startsWith("F");
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&past_days=30&forecast_days=1&timezone=auto${F?"&temperature_unit=fahrenheit&precipitation_unit=inch":""}`);
    const d=(await r.json()).daily;
    return d.time.map((t,i)=>({date:t,d:toDate(t),high:d.temperature_2m_max[i]==null?null:Math.round(d.temperature_2m_max[i]),low:d.temperature_2m_min[i]==null?null:Math.round(d.temperature_2m_min[i]),rain:+(d.precipitation_sum[i]||0).toFixed(2),conditions:WMO[d.weather_code[i]]??"",notes:""})).filter(r=>r.high!=null);
  }catch(e){return null}
}
function renderLog(body,status){
  const all=weatherRows(),rows=all.slice(-30);
  if(!rows.length){body.innerHTML="<p>No weather logged yet.</p>";return}
  const W=600,H=230,L=34,R=34,T=14,B=26,RB=46;
  const hi=Math.max(...rows.map(r=>r.high)),lo=Math.min(...rows.map(r=>r.low??r.high));
  const t0=Math.floor((lo-3)/5)*5,t1=Math.ceil((hi+3)/5)*5;
  const maxRain=Math.max(.25,...rows.map(r=>r.rain));
  const X=i=>L+(rows.length===1?(W-L-R)/2:i*(W-L-R)/(rows.length-1));
  const Y=v=>T+(1-(v-t0)/(t1-t0))*(H-T-B-RB);
  const RY=H-B,rH=v=>v/maxRain*(RB-6);
  const ticks=[];for(let v=t0;v<=t1;v+=Math.max(5,Math.round((t1-t0)/4/5)*5))ticks.push(v);
  const path=k=>rows.map((r,i)=>r[k]==null?"":`${i?"L":"M"}${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join("");
  const band=rows.map((r,i)=>`${i?"L":"M"}${X(i)},${Y(r.high)}`).join("")+rows.slice().reverse().map((r,j)=>`L${X(rows.length-1-j)},${Y(r.low??r.high)}`).join("")+"Z";
  const bw=Math.max(3,Math.min(14,(W-L-R)/rows.length*.6));
  const month=rows[rows.length-1].d.getMonth(),yr=rows[rows.length-1].d.getFullYear();
  const rainMonth=all.filter(r=>r.d.getMonth()===month&&r.d.getFullYear()===yr).reduce((s,r)=>s+r.rain,0);
  const U=(SET.units||"F").toUpperCase().startsWith("F")?"°F":"°C",RU=U==="°F"?'"':" mm";
  body.innerHTML=`${HIST?"":exampleTag()}
  <h3>Last ${rows.length} days · ${esc(SET.location_name||"")}${HIST?" · live":""}</h3>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily high and low temperatures with rainfall">
    ${ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`).join("")}
    <path class="band" d="${band}"/>
    <path class="hi" d="${path("high")}"/><path class="lo" d="${path("low")}"/>
    <circle cx="${X(rows.length-1)}" cy="${Y(rows[rows.length-1].high)}" r="4" style="fill:var(--title-b)"/>
    <line class="grid-l" x1="${L}" x2="${W-R}" y1="${RY}" y2="${RY}"/>
    ${rows.map((r,i)=>r.rain>0?`<rect class="rain" x="${X(i)-bw/2}" y="${RY-rH(r.rain)}" width="${bw}" height="${rH(r.rain)}"><title>${fmtDate(r.d)}: ${r.rain}${RU}</title></rect>`:"").join("")}
    <text x="${W-R+6}" y="${RY-RB+12}">${maxRain.toFixed(2)}${RU}</text><text x="${W-R+6}" y="${RY+4}">0</text>
    <text x="${L}" y="${H-6}">${fmtDate(rows[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(rows[rows.length-1].d)}</text>
  </svg>
  <div class="legend"><span><i style="background:var(--title-b)"></i>High</span><span><i style="background:#6a6488"></i>Low</span><span><i style="background:#7f97b4;height:8px;width:8px"></i>Rain</span></div>
  <div class="tbl"><table><thead><tr><th>Date</th><th>High</th><th>Low</th><th>Rain</th><th>Conditions</th><th>Notes</th></tr></thead><tbody>
  ${rows.slice().reverse().map(r=>`<tr><td>${fmtDate(r.d)}</td><td class="n">${r.high}°</td><td class="n">${r.low??"—"}°</td><td class="n">${r.rain}${RU}</td><td>${esc(r.conditions)}</td><td class="wrap">${linkify(r.notes)}</td></tr>`).join("")}
  </tbody></table></div>`;
  status.innerHTML=`<span>Peak ${hi}${U}</span><span>Rain this month ${rainMonth.toFixed(2)}${RU}</span>`;
}

function renderPage(p){return body=>{
  body.innerHTML=String(p.body||"").split(/\n\s*\n/).map(par=>`<p>${linkify(par).replace(/\n/g,"<br>")}</p>`).join("")
    +(p.link?`<p><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a></p>`:"");
}}

/* ---------- build desktop ---------- */
function iconBtn(id,label,icon,badge){
  const b=document.createElement("button");b.className="icon";
  b.innerHTML=`<span class="badge"><img alt="" src="${sprite(icon)}">${badge?`<i>${badge}</i>`:""}</span><span>${esc(label)}</span>`;
  b.onclick=()=>openWin(id);return b;
}
function build(){
  document.getElementById("windows").innerHTML="";for(const k in WINS)delete WINS[k];openOrder=0;
  const L=document.getElementById("iconsLeft"),R=document.getElementById("iconsRight");L.innerHTML=R.innerHTML="";
  const t=[SET.title_line_1,SET.title_line_2,SET.title_line_3].filter(Boolean);
  // every character gets a fixed cell so the right-aligned title never shifts while it types
  const h1=document.getElementById("title");h1.setAttribute("aria-label",t.join(" "));
  h1.innerHTML=t.map((s,i)=>`<span aria-hidden="true">${[...s].map((ch,j)=>`<i class="ch${j===s.length-1?" eol":""}">${esc(ch)}</i>`).join("")}${i===t.length-1?'<b class="cursor"></b>':''}</span>`).join("");
  typeTitle();
  document.getElementById("tagline").textContent=SET.tagline||"";
  document.title=t.join(" ").replace(/,/g,"")||"Xerophyte Labs";
  const words=(SET.marquee||"Always under construction").split("|").map(s=>s.trim()).filter(Boolean);
  // Settings › show_marquee: "no", "off", "false", "hide" or "0" hides the scrolling banner
  document.querySelector(".marquee").hidden=/^(no|off|false|hide|hidden|0)$/i.test(String(SET.show_marquee||"").trim());
  const run=words.join(" · ")+" · ";document.getElementById("marquee").textContent=(run.repeat(Math.ceil(30/words.length))).repeat(2);
  document.getElementById("startside").textContent=SET.start_label||"Xerophyte Labs";

  const mob=innerWidth<=700,cx=w=>Math.max(130,(innerWidth-w)/2);
  defineWindow("cacti",{title:"My Cacti",icon:"saguaro",w:640,x:mob?16:120,y:84,render:renderCacti,menu:["File","View","Water"],status:true});
  defineWindow("map",{title:"Desert Map",icon:"map",w:Math.min(860,innerWidth-40),x:mob?16:Math.max(110,(innerWidth-860)/2),y:70,render:renderMap,status:true});
  defineWindow("radio",{title:radioName(),icon:"radio",w:380,x:innerWidth-450,y:300,render:renderRadio,status:true});
  defineWindow("today",{title:"Weather Now",icon:"sun",w:420,x:innerWidth-560,y:96,render:renderToday,status:true});
  defineWindow("log",{title:"Weather Log",icon:"chart",w:640,x:cx(640),y:110,render:renderLog,menu:["File","Edit","Chart"],status:true});
  const thirsty=(DATA.cacti||[]).filter(c=>c.name&&cactusState(c).status==="thirsty").length;
  HIDE_WILD=new Set((DATA.wildlife||[]).filter(r=>isNo(r.show)).map(r=>String(r.animal||"").trim().toLowerCase()));
  // Desktop tab: show = no hides an icon (and its Start menu entry); label renames it
  const HIDDEN=new Set();
  const place=(col,id,label,icon,badge)=>{const r=deskRow(id,label);if(r&&isNo(r.show)){HIDDEN.add(id);return}
    // the radio is always named by Settings › radio_title; a Desktop label only applies when that is blank
    const lab=id==="radio"&&String(SET.radio_title||"").trim()?"":r&&r.label;
    const name=lab||label;if(WINS[id]&&lab){WINS[id].title=lab;WINS[id].el.querySelector(".bar b").textContent=lab;WINS[id].el.setAttribute("aria-label",lab)}col.append(iconBtn(id,name,icon,badge))};
  place(L,"cacti","My Cacti","saguaro",thirsty||"");place(L,"log","Weather Log","chart");
  place(mob?L:R,"today","Weather Now","sun");place(mob?L:R,"map","Desert Map","map");place(mob?L:R,"radio",radioName(),"radio");
  (DATA.pages||[]).filter(p=>p.title).forEach((p,i)=>{
    const id="p"+i;defineWindow(id,{title:p.title,icon:(p.icon||"folder").toLowerCase(),w:440,x:mob?16:140+i*30,y:120+i*24,render:renderPage(p)});
    place((p.side||"").toLowerCase()==="right"&&!mob?R:L,id,p.title,(p.icon||"folder").toLowerCase());
  });
  // warm up the Spotify player API in the background so the radio and disco start fast
  if(spotifySrc(SET.spotify_url||SET.spotify_playlist))setTimeout(preloadSpotify,1200);
  // start menu
  const ul=document.getElementById("startlist");ul.innerHTML="";
  Object.entries(WINS).filter(([id])=>!HIDDEN.has(id)).forEach(([id,w])=>{const li=document.createElement("li");li.innerHTML=`<button><img alt="" src="${sprite(w.icon)}">${esc(w.title)}</button>`;li.firstChild.onclick=()=>{toggleStart(false);openWin(id)};ul.appendChild(li)});
  ul.insertAdjacentHTML("beforeend",'<hr class="adm">');
  // sheet tools only show in admin mode; the check says whether the site is reading the sheet
  const mark=SHEET_STATE==="ok"?'<span class="chk ok" title="Reading the sheet">✓</span>':SHEET_STATE==="partial"?'<span class="chk warn" title="Some tabs could not be read">!</span>':'<span class="chk off" title="Showing sample data">✗</span>';
  const rl=document.createElement("li");rl.className="adm";rl.innerHTML=`<button><img alt="" src="${sprite("globe")}">Refresh from sheet${mark}</button>`;rl.firstChild.onclick=()=>{toggleStart(false);boot(true)};ul.appendChild(rl);
  if(CONFIG.SHEET_ID){const ed=document.createElement("li");ed.className="adm";ed.innerHTML=`<a href="https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit" target="_blank" rel="noopener"><img alt="" src="${sprite("book")}">Open the sheet</a>`;ul.appendChild(ed)}
  updateTray();
}
function typeTitle(){
  const h=document.getElementById("title"),chars=[...h.querySelectorAll(".ch")];
  clearTimeout(typeTitle.t);
  if(document.body.classList.contains("still")){chars.forEach(c=>c.className="ch on");h.classList.remove("typing");return}
  chars.forEach(c=>c.classList.remove("on","caret"));h.classList.add("typing");
  let i=0;
  const step=()=>{
    if(i>0){chars[i-1].classList.remove("caret");chars[i-1].classList.add("on")}
    if(i<chars.length){chars[i].classList.add("caret");const eol=i>0&&chars[i-1].classList.contains("eol");i++;
      typeTitle.t=setTimeout(step,(eol?220:0)+38+Math.random()*52)}
    else{h.classList.remove("typing");typeTitle.t=setTimeout(neonTagline,250)}
  };
  typeTitle.t=setTimeout(step,450);
}
function neonTagline(){
  const t=document.getElementById("tagline");if(!t||document.body.classList.contains("still"))return;
  t.classList.remove("neon");void t.offsetWidth;t.classList.add("neon");
}
function updateTray(){

  const ll=document.getElementById("liveLine");
  if(LIVE&&LIVE.current){const c=LIVE.current,F=(SET.units||"F").toUpperCase().startsWith("F");
    ll.innerHTML=`<img class="wx" src="${wxIcon(c.weather_code,SCENE.night)}" alt="${esc(WMO[c.weather_code]??"")}" title="${esc(SET.location_name||"")}"><span>${Math.round(c.temperature_2m)}° · ${esc(WMO[c.weather_code]??"")} · wind ${Math.round(c.wind_speed_10m)} ${F?"mph":"km/h"}</span>`;ll.hidden=false}
  else ll.hidden=true;
}
function tick(){if(SCENE.override==null&&isNightNow()!==SCENE.night)setNight(!SCENE.night);const d=new Date();document.getElementById("clock").textContent=d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}).toLowerCase().replace(" ","")}
function toggleStart(force){const m=document.getElementById("startmenu"),b=document.getElementById("startbtn");const on=force??m.hidden;m.hidden=!on;b.setAttribute("aria-expanded",on)}
document.getElementById("startbtn").onclick=e=>{e.stopPropagation();toggleStart()};
document.addEventListener("click",e=>{if(!e.target.closest("#startmenu"))toggleStart(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){toggleStart(false);const a=Object.keys(WINS).find(k=>WINS[k].el.classList.contains("active")&&WINS[k].open);if(a)closeWin(a)}});

async function boot(refresh){
  const wasOpen=refresh?Object.keys(WINS).filter(k=>WINS[k].open&&!WINS[k].min):[];
  await loadAll();build();
  wasOpen.forEach(openWin);
  [LIVE,HIST]=await Promise.all([loadLive(),loadHistory()]);updateTray();
  ["today","log"].forEach(id=>{if(WINS[id].open&&!WINS[id].min)openWin(id)});
  if(!refresh&&!boot.timer)boot.timer=setInterval(async()=>{LIVE=await loadLive()||LIVE;HIST=await loadHistory()||HIST;updateTray();if(WINS.today.open&&!WINS.today.min)openWin("today")},15*60e3);
}
const hashMode=(location.hash||"").slice(1).toLowerCase();
if(hashMode==="night"||hashMode==="day")SCENE.override=hashMode==="night";
SCENE.motion=motionPref();setMotion(SCENE.motion,false);
setNight(SCENE.override??isNightNow());
// favicon: the beavertail prickly pear specimen, scaled up crisply
(()=>{const src=document.createElement("canvas");src.width=src.height=24;drawSpecimen(src.getContext("2d"),"opuntia");
  const cv=document.createElement("canvas");cv.width=cv.height=48;const x=cv.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(src,0,0,48,48);
  document.getElementById("favicon").href=cv.toDataURL("image/png")})();
setDisco(false);
document.getElementById("discobtn").onclick=()=>setDisco(!SCENE.disco,true);
tick();setInterval(tick,30000);
document.getElementById("modebtn").onclick=()=>{SCENE.override=!SCENE.night;setNight(SCENE.override)};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(paintSky,150)});
document.body.classList.toggle("admin",ADMIN);boot();
</script>
