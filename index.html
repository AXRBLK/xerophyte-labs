<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xerophyte Labs</title>
<link rel="icon" id="favicon" type="image/png" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed painted desert desktop, icon columns on both edges, draggable Win95 windows, taskbar pinned bottom. Dusk palette by day, moonlit palette (body.night) after 7pm local. */
:root{
  color-scheme: dark;
  --dusk:#2c2638;        /* deep sky / page ground */
  --sand:#e4d0b4;        /* light text on paint */
  --sun:#c98c70;         /* accent */
  --bloom:#c0607a;       /* prickly-pear flower pink, alerts */
  --sage:#8aa078;        /* cactus green, healthy */
  --chrome:#c7bdb4;      /* window chrome (warm Win95 grey) */
  --chrome-hi:#f4eee8;
  --chrome-lo:#6d625b;
  --ink:#1c1218;
  --paper:#fbf6ef;
  --title-a:#5e4a5c; --title-b:#a8785e;
  --link:#5e4a5c; --card:#ffffff; --line:#d9cbbd; --line2:#eadfd3; --mute:#6d5a52; --ink2:#4a3a36; --band:#f1e2d4;
  --font-display:"Silkscreen","Pixelify Sans","Courier New",monospace;
  --font-ui:"Pixelify Sans","Tahoma","Verdana",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"Menlo",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--dusk);color:var(--sand);font-family:var(--font-data);font-size:14px;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

/* marquee */
.marquee{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));border:2px solid var(--sand);overflow:hidden;white-space:nowrap;z-index:2;background:rgba(42,20,51,.12)}
.marquee .track{display:inline-block;padding:6px 0;font-family:var(--font-ui);font-size:17px;animation:scroll 60s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* hero title */
.hero{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;pointer-events:none;z-index:1}
.hero h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:28.8px;line-height:1.15;letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never;color:#f4ece0;text-shadow:2px 2px 0 rgba(40,36,58,.6)}
/* the title reads as one centred line on a single dark plate, flat (no outline or drop shadow) */
.hero{align-items:center;text-align:center}
.hero h1{white-space:nowrap;padding:4px 12px 5px;background:rgba(36,30,50,.72);text-shadow:none!important}
.hero h1 span{display:inline}
.hero h1 span+span::before{content:" "}
.hero h1 .cursor,.hero h1.typing .ch.caret{box-shadow:none}
.hero h1{position:relative}
/* load: a block cursor types the title, then the tagline flickers on in neon */
.hero h1 .ch{font-style:normal;white-space:pre}
.hero h1.typing .ch{visibility:hidden}
.hero h1.typing .ch.on{visibility:visible}
.hero h1.typing .ch.caret{visibility:visible;color:transparent;background:#f4ece0;text-shadow:none;box-shadow:2px 2px 0 rgba(40,36,58,.6)}
.hero h1.typing .cursor{visibility:hidden}
.hero h1 .cursor{display:inline-block;width:.5em;height:.82em;margin-left:.18em;vertical-align:-.04em;background:currentColor;box-shadow:2px 2px 0 rgba(40,36,58,.6);animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero .sub.neon{animation:neon 2.4s steps(1,end) 1 both}
@keyframes neon{
  0%,6%,12%{color:#7dff7a;text-shadow:0 0 3px #39ff3a,0 0 9px #39ff3a;}
  3%,9%{color:#2e6a2e;text-shadow:none}
  70%,100%{color:#7dff7a;text-shadow:0 0 3px #39ff3a,0 0 9px #39ff3a;}
}
.hero .sub{transition:color .6s,text-shadow .6s,background-color .6s}
body.still .hero h1 .cursor{animation:none}
.hero .sub,.hero .live{display:inline-block;padding:2px 8px;background:rgba(40,36,58,.78);font-family:var(--font-ui);font-size:13.2px;letter-spacing:.08em;text-transform:uppercase;color:#efe2cc}
.hero .live{text-transform:none;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hero .live{display:inline-flex;align-items:center;gap:8px}.hero .live .wx{width:26px;height:26px;image-rendering:pixelated;image-rendering:crisp-edges;margin:-3px 0}

/* icons */
.icons{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));bottom:56px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;z-index:3;align-content:flex-start}
.icons.left{left:10px}.icons.right{right:10px;align-content:flex-end}
.icon{width:88px;padding:6px 2px;border:1px dotted transparent;background:none;color:#fff;font-family:var(--font-ui);font-size:14px;line-height:1.15;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.icon img{width:48px;height:48px;image-rendering:pixelated}
.icon:hover span,.icon:focus-visible span{background:var(--title-a)}
.icon:focus-visible{outline:none;border-color:#fff}
.icon .badge{position:relative}
.icon .badge i{position:absolute;right:-8px;top:-6px;font-style:normal;background:var(--bloom);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;border:1px solid #fff}

/* windows */
.win{position:fixed;min-width:280px;max-width:calc(100vw - 32px);max-height:calc(100% - 110px);display:flex;flex-direction:column;background:var(--chrome);color:var(--ink);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);box-shadow:1px 1px 0 #000,6px 8px 0 rgba(28,18,24,.35);z-index:10;font-family:var(--font-ui)}
.win[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;background:linear-gradient(90deg,var(--chrome-lo),#9b908a);color:var(--chrome-hi);cursor:grab;user-select:none;touch-action:none}
.win.active .bar{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:#fff}
.bar img{width:16px;height:16px;image-rendering:auto}
.bar b{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:22px;height:20px;padding:0;font:600 13px/1 var(--font-ui);background:var(--chrome);color:var(--ink);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);cursor:pointer}
.bar button:active{border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo)}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:13px;border-bottom:1px solid var(--chrome-lo)}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.cform{display:grid;gap:10px;margin-top:6px}
/* contact: a picture postcard. Picture and message on the left, stamp (the send button), address and sender lines on the right */
.cform.postcard{grid-template-columns:1.12fr 1fr;gap:0;margin:0;padding:16px 16px 14px;background:#f6efdc;color:#3a2e26;border:1px solid #d6c7a4;box-shadow:inset 0 0 0 6px #f6efdc,inset 0 0 0 7px #e2d4b2;position:relative}
.postcard .pc-left{padding-right:16px;border-right:2px solid #cdbd96;display:flex;flex-direction:column;gap:8px;min-width:0}
.postcard .pc-right{padding-left:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.postcard .pc-art{position:relative;border:3px solid #fff;box-shadow:1px 1px 0 #cdbd96,2px 2px 0 rgba(0,0,0,.08);line-height:0}
.postcard .pc-art canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.postcard .pc-greet{position:absolute;left:8px;top:6px;font:400 15px/1 var(--font-display);color:#fff6e0;text-shadow:1px 1px 0 #5a2a40,2px 2px 0 #5a2a40;text-transform:uppercase;letter-spacing:.02em}
.postcard .pc-greet small{display:block;font:400 9px/1.4 var(--font-display);letter-spacing:.12em}
.postcard .pc-caption{margin:0;font:13px/1.35 var(--font-ui);color:#6a5a48}
.postcard .pc-msg textarea{min-height:120px;background:transparent repeating-linear-gradient(180deg,transparent 0 21px,#c9d6e6 21px 22px);border:0;padding:2px 2px;font:15px/22px var(--font-ui);color:#23304a;resize:vertical}
.postcard .pc-to{font:13px/1.5 var(--font-data);color:#4a3a2c;padding:2px 0 4px 10px;border-left:2px solid #e2d4b2}
.postcard .pc-to b{font-family:var(--font-display);font-weight:400;font-size:11px;color:#a83a2a}
.postcard .pc-line{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:8px;font:13px var(--font-ui);color:#6a5a48}
.postcard .pc-line input{background:transparent;border:0;border-bottom:2px dotted #b8a888;padding:4px 2px 2px;font:15px var(--font-ui);color:#23304a}
.postcard input:focus,.postcard textarea:focus{outline:2px dotted #a83a2a;outline-offset:2px}
.postcard .sr{position:absolute;left:-9999px}
.postcard .stamp{align-self:flex-end;position:relative;width:96px;height:112px;padding:7px;display:flex;background:repeating-linear-gradient(-45deg,#c8202f 0 7px,#fff 7px 14px,#1f3f8f 14px 21px,#fff 21px 28px);border:5px dotted #f6efdc;outline:1px solid #e2d4b2;outline-offset:-5px;box-shadow:2px 2px 0 rgba(58,46,38,.18);cursor:pointer;transform:rotate(2deg);transition:transform .15s}
.postcard .stamp:hover{transform:rotate(-1deg) translateY(-2px)}.postcard .stamp:active{transform:rotate(0) translateY(1px)}
.postcard .stamp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;padding:4px 3px}
.postcard .stamp canvas{width:60px;height:44px;image-rendering:pixelated}
.postcard .stamp-air{font:400 8px var(--font-display);color:#1f3f8f;letter-spacing:.14em}
.postcard .stamp-send{font:400 15px/1 var(--font-display);color:#c8202f;letter-spacing:.06em}
.postcard .stamp:disabled{opacity:.7}
.postcard .postmark{position:absolute;left:-30px;top:18px;width:66px;height:66px;border:2px solid rgba(40,50,90,.7);border-radius:50%;display:none;align-items:center;justify-content:center;flex-direction:column;font:400 12px/1.1 var(--font-display);color:rgba(40,50,90,.75);transform:rotate(-14deg);text-align:center;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(40,50,90,.0) 6px 7px)}
.postcard .postmark small{font-size:8px}
.postcard .stamp.posted .postmark{display:flex}
/* the unsent-card nudge: the bottom-right corner folds up, a pencilled note appears, and the stamp wiggles */
/* unsent-card nudge: just the stamp's top-left corner peels up, showing its paper back */
.postcard .stamp::before{content:"";position:absolute;left:-5px;top:-5px;width:0;height:0;z-index:2;background:linear-gradient(135deg,#f6efdc 0 50%,#e8e0cc 50%,#d4c8ac 100%);box-shadow:2px 2px 3px rgba(58,46,38,.3);transition:width .3s,height .3s;pointer-events:none}
.postcard.hint .stamp::before{width:26px;height:26px}

@keyframes stampNudge{0%,100%{transform:rotate(2deg)}25%{transform:rotate(-6deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.postcard .cmsg{font:13px var(--font-ui);color:#4a3a2c}
.postcard .cmsg.ok{color:#2f7a3a}.postcard .cmsg.err{color:#a83a2a}
/* postcard type: the same thin, letter-spaced face as the taskbar's MODE label */
.postcard .pc-caption,.postcard .pc-line,.postcard .pc-to,.postcard .cmsg,.postcard .pc-line input,.postcard .pc-msg textarea{font-family:var(--font-data);font-weight:300}
.postcard .pc-caption,.postcard .pc-line>span,.postcard .pc-to{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.postcard .pc-to{font-size:12px;line-height:1.7}.postcard .pc-to b{font-family:var(--font-data);font-weight:400;font-size:11px}
.postcard .pc-line input{font-size:14px;letter-spacing:.02em}.postcard .pc-msg textarea{font-size:14px;letter-spacing:.02em}
body.night .cform.postcard input,body.night .cform.postcard textarea{background:transparent}
body.night .postcard .pc-msg textarea{background:transparent repeating-linear-gradient(180deg,transparent 0 21px,#c9d6e6 21px 22px)}
body.night .postcard .cmsg.ok{color:#2f7a3a}body.night .postcard .cmsg.err{color:#a83a2a}
@media (max-width:640px){.cform.postcard{grid-template-columns:1fr}.postcard .pc-left{padding:0 0 12px;border-right:0;border-bottom:2px solid #cdbd96}.postcard .pc-right{padding:12px 0 0}.postcard .stamp{width:84px;height:100px}.postcard .stamp canvas{width:50px;height:36px}}
.cform label{display:grid;gap:3px;font:13px var(--font-ui);color:var(--ink)}.cform label b{color:#a83a2a;font-weight:400}
.cform input,.cform textarea{width:100%;box-sizing:border-box;padding:6px 7px;font:14px var(--font-data);color:var(--ink);background:#fffdf8;border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);border-radius:0}
.cform textarea{resize:vertical;min-height:96px}
/* make sure fields always take a tap and a caret on touch screens (iOS needs selectable text and a 16px font to type without zooming) */
.cform input,.cform textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation;pointer-events:auto;position:relative;z-index:1}
@media (pointer:coarse),(max-width:500px){.cform input,.cform textarea{font-size:16px}}
.cform input:focus,.cform textarea:focus{outline:2px dotted var(--title-a);outline-offset:1px}
.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cform .crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cform button{padding:6px 16px;font:14px var(--font-ui);color:var(--ink);background:var(--chrome);border:2px solid;border-color:var(--chrome-hi) var(--chrome-lo) var(--chrome-lo) var(--chrome-hi);cursor:pointer}
.cform button:active{border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo)}.cform button:disabled{opacity:.6;cursor:default}
.cform .cmsg{font:13px var(--font-ui)}.cform .cmsg.ok{color:#2f7a3a}.cform .cmsg.err{color:#a83a2a}
body.night .cform input,body.night .cform textarea{background:#14162a}body.night .cform .cmsg.ok{color:#6ade74}body.night .cform .cmsg.err{color:#ff8a76}
.body{margin:6px;flex:1;overflow:auto;background:var(--paper);border:2px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);padding:14px;font-family:var(--font-data);font-size:13px;line-height:1.55;min-height:0}
.status{display:flex;gap:4px;padding:0 6px 5px;font-size:12px}
.status span{flex:1;padding:1px 6px;border:1px solid;border-color:var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body p{margin:0 0 .9em;max-width:62ch}
.body a{color:var(--link)}
.body h3{font-family:var(--font-ui);font-weight:600;font-size:15px;margin:0 0 8px}

/* cacti */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-family:var(--font-ui)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--ink);font-family:var(--font-ui);font-size:12px;white-space:nowrap}
.chip.thirsty{background:var(--bloom);color:#fff;border-color:#8a1f45}
.chip.soon{background:#e8d29c;color:#1c1218}
.chip.fine{background:#d4dfc8;color:#1c1218}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.cactus{display:grid;grid-template-columns:48px 1fr;gap:4px 10px;padding:10px;background:var(--card);border:1px solid var(--line);min-width:0}
.cactus img.sp{width:48px;height:48px;image-rendering:pixelated;grid-row:span 3;object-fit:cover}
.cactus .nm{font-family:var(--font-ui);font-weight:600;font-size:16px;line-height:1.1;display:flex;justify-content:space-between;gap:6px;align-items:start}
.cactus .sci{font-style:italic;color:var(--mute);font-size:12px;line-height:1.3}
.cactus .meta{font-size:12px;color:var(--ink2)}
.meter{grid-column:1/-1;height:10px;border:1px solid var(--ink);background:repeating-linear-gradient(90deg,var(--line2) 0 9px,var(--line) 9px 10px);margin-top:4px}
.meter i{display:block;height:100%;background:var(--sage)}
.meter i.soon{background:#d4b064}.meter i.thirsty{background:var(--bloom)}
.cactus .note{grid-column:1/-1;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}

/* weather */
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.now .big{font-family:var(--font-display);font-size:48px;-webkit-font-smoothing:none;line-height:1;color:var(--link);font-variant-numeric:tabular-nums}
.now .cond{font-family:var(--font-ui);font-size:18px}
.now dl{display:grid;grid-template-columns:auto auto;gap:0 12px;margin:6px 0 0;font-size:12px}
.now dt{color:var(--mute)}.now dd{margin:0;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.day{border:1px solid var(--line);background:var(--card);padding:6px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.day b{display:block;font-family:var(--font-ui);font-weight:600;font-size:13px}
.day small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line)}
.chart .grid-l{stroke:var(--line2);stroke-width:1}
.chart .hi{fill:none;stroke:var(--title-b);stroke-width:2.5}
.chart .lo{fill:none;stroke:#6a6488;stroke-width:2;stroke-dasharray:5 3}
.chart .band{fill:var(--band)}
.chart .rain{fill:#7f97b4}
.chart text{fill:var(--mute);font:11px var(--font-data)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin:8px 0 12px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th{font-family:var(--font-ui);font-weight:600;text-align:left;background:var(--chrome);border:1px solid var(--chrome-lo);padding:3px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line2);padding:4px 6px;white-space:nowrap}
td.n{text-align:right}
td.wrap{white-space:normal;min-width:140px}
.bio h3{margin:14px 0 6px;font:600 13px var(--font-ui);letter-spacing:.04em;text-transform:uppercase}
#bioTip{position:fixed;z-index:9999;pointer-events:none;background:var(--chrome,#d6cfc0);border:2px solid;border-color:var(--chrome-hi,#fff) var(--chrome-lo,#666) var(--chrome-lo,#666) var(--chrome-hi,#fff);padding:8px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
#bioTip img{image-rendering:pixelated;display:block}#bioTip span{font:11px var(--font-ui);color:var(--ink,#222)}
.bio td.sp{cursor:help}
.bio td.habits{font-size:11px;line-height:1.35;min-width:150px;white-space:normal}.bio .bio-head{margin:0 0 4px}.bio .bio-stats{margin:6px 0 0;font-size:12px}.bio .bio-note{margin-top:14px;font-size:11px}
.bio tr.off td{opacity:.5}
.bio .biot td{white-space:normal;vertical-align:top;line-height:1.35}.bio .biot .sci{font-size:11px;opacity:.8}.bio .biot td.big{font-size:15px;font-weight:600}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(28,18,24,.62);border-top:1px solid rgba(243,201,160,.6);z-index:50;font-family:var(--font-ui)}
.start{padding:4px 14px;font:600 15px var(--font-ui);color:#fff;background:transparent;border:1px solid var(--sand);cursor:pointer}
.start[aria-expanded="true"]{background:var(--title-a)}
.tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.task{max-width:160px;padding:4px 10px;color:var(--sand);background:transparent;border:1px solid rgba(243,201,160,.45);font:13px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.task.on{background:rgba(243,201,160,.18);border-color:var(--sand);color:#fff}
.tray{display:flex;align-items:center;gap:16px;padding:4px 12px;border:1px solid rgba(243,201,160,.45);font-size:13px;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.startmenu .adm{display:none}body.admin .startmenu .adm{display:block}

/* mini player in the taskbar while the window is minimized */
.miniamp{display:flex;align-items:center;gap:2px;padding:2px;background:#24243a;border:1px solid #6a6a86;flex-shrink:0}
/* the turntable glides in from the right edge of the window when music starts, and back out when it stops */
.turntable{width:128px;height:112px;margin:2px auto 0;cursor:pointer;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35));
  transform:translateX(calc(100vw));visibility:hidden;transition:transform .9s cubic-bezier(.2,.8,.25,1),visibility 0s linear .9s}
.turntable.on{transform:none;visibility:visible;transition:transform .9s cubic-bezier(.2,.8,.25,1),visibility 0s}
.turntable.fromLeft{transform:translateX(-100vw)}.turntable.fromLeft.on{transform:none}
/* phones: the icons fill the right, so the turntable parks top-left and glides in from the left edge */
@media (pointer:coarse),(max-width:500px){.miniamp{display:none!important}#discobtn{display:none!important}}   /* phones: no disco mode */   /* phones: the turntable is the mini player */
@media (pointer:coarse),(max-width:500px){
  .turntable{position:fixed;left:12px;top:auto;bottom:calc(54px + env(safe-area-inset-bottom,0px));width:96px;height:84px;margin:0;z-index:3;transform:translateX(-100vw)}
  .turntable.on{transform:none}
  body .turntable canvas{width:96px;height:84px}
  body .turntable .deck-art{left:26px;top:26px;width:27px;height:27px}
  body .turntable .deck-pin{left:38px;top:38px;width:2px;height:2px}
  /* phones: the title block moves to the top of the screen, above the marquee and the icons */
  .hero{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:12px;right:12px;max-width:none}
}
@media (pointer:fine) and (min-width:501px),(pointer:none) and (min-width:501px){.turntable{position:relative}}   /* phones pin it with position:fixed instead */
.turntable canvas{width:128px;height:112px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
/* the album cover: a crisp circular label centred on the platter (canvas 26,26 → 52px,52px), spinning at 33⅓ rpm */
.turntable .deck-art{position:absolute;left:35px;top:35px;width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #17171d;animation:deckspin 1.8s linear infinite;animation-play-state:paused}
.turntable.spin .deck-art{animation-play-state:running}
.turntable .deck-pin{position:absolute;left:51px;top:51px;width:3px;height:3px;background:#e4e4ec;box-shadow:1px 1px 0 #6c6c78}
@keyframes deckspin{to{transform:rotate(360deg)}}

.miniamp button:active{border-color:#50506a #f0f0f8 #f0f0f8 #50506a}

.miniamp .mini-title{overflow:hidden;max-width:220px;color:#00b000}.miniamp .mini-title span{display:inline-block;animation:scroll 16s linear infinite}

/* night mode: moonlit desktop */
.modebtn{background:none;border:0;padding:0 2px;color:inherit;font:15px var(--font-ui);cursor:pointer;line-height:1}
.modebtn:focus-visible{outline:1px dotted currentColor}
.modebtn img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px}
#modebtn{display:inline-flex;align-items:center;gap:5px;padding:0 4px}

#discobtn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
#discobtn .ball{font-size:15px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;display:inline-block}
#discobtn[aria-pressed="true"]{background:#4169e1;outline:3px solid #2a4cc0;outline-offset:1px;box-shadow:0 0 10px rgba(65,105,225,.85)}
/* the ball stays upright and turns on its axis: facet light slides across its face, glints twinkle on top */
#discobtn .ball{position:relative}
#discobtn[aria-pressed="true"] .ball::after{content:"";position:absolute;inset:24% 9% 2% 9%;border-radius:50%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.8) 3px 3.5px,rgba(160,190,255,0) 3.5px 6px);
  background-size:6px 100%;mix-blend-mode:screen;animation:orbit 1.1s linear infinite}
#discobtn[aria-pressed="true"] .ball::before{content:"";position:absolute;width:3px;height:3px;right:0;top:20%;background:#fff;
  box-shadow:-9px 7px 0 -1px #fff,-4px 11px 0 -1px #cfe0ff;border-radius:50%;animation:glint 1.1s steps(2) infinite}
@keyframes orbit{from{background-position:0 0}to{background-position:6px 0}}
@keyframes glint{50%{opacity:.15}}
body.still #discobtn .ball::after,body.still #discobtn .ball::before{animation:none}

function drawLayer(c,L,p,alpha){

/* ---------- data helpers ---------- */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;else if(ch==","){row.push(f);f=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch;}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function toObjects(rows){
  if(!rows.length)return[];
  const h=rows[0].map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])));
}
async function loadTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  return toObjects(parseCSV(await r.text()));
}
function toDate(s){
  if(!s)return null;s=String(s).trim();
  const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
  const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');

function cactusState(c){
  const last=toDate(c.last_watered),every=num(c.water_every_days)||14;
  const since=last?daysBetween(last,today()):null;
  const left=since==null?null:every-since;

/* a playlist embed only ever reports the playlist itself as "playingURI", never the song. So: fetch the playlist's own embed

async function loadTrackList(src){
  if(!src||src.type!=="playlist"&&src.type!=="album")return;
  if(TRACKS.src===src.id&&(TRACKS.list||TRACKS.status==="loading"))return;
  TRACKS.src=src.id;TRACKS.status="loading";TRACKS.list=null;
  const key="xl-tracks-"+src.id;
  try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<6*3600e3&&c.list.length){TRACKS.list=c.list;SPOT.lastDur=0;TRACKS.status="cache "+c.list.length;radioDebug();return}}catch(_){}

    try{const html=await fetch(r(page)).then(x=>x.ok?x.text():"");

    return o.map(t=>({uri:t.uri||"",title:String(t.title),artist:String(t.subtitle||(t.artists||[]).map(a=>a.name).join(", ")||""),dur:+(t.duration||t.duration_ms)||0}));

function cactusKind(c){
  const t=`${c.type||""} ${c.species||""} ${c.common_name||""}`.toLowerCase();
  if(/saguaro|carnegiea/.test(t))return "saguaro";
  if(/cholla|cylindropuntia/.test(t))return "cholla";
  if(/opuntia|prickly|beavertail|nopal/.test(t))return "opuntia";
  return "barrel";
}

function weatherRows(){

  if(!HIST)return sheet.filter(r=>r.high!=null).sort((a,b)=>a.d-b.d);

  const by=new Map(HIST.map(r=>[+r.d,{...r}]));

}

function diversity(counts){
  const n=counts.filter(c=>c>0),N=n.reduce((a,b)=>a+b,0);if(!N)return {S:0,N:0,H:0,E:0,D:0};
  const H=-n.reduce((a,c)=>a+(c/N)*Math.log(c/N),0),S=n.length;
  const D=N>1?1-n.reduce((a,c)=>a+c*(c-1),0)/(N*(N-1)):0;
  return {S,N,H,E:S>1?H/Math.log(S):0,D};
}

function renderLog(body,status){

  const W=600,H=230,L=34,R=34,T=14,B=26,RB=46;
  const hi=Math.max(...rows.map(r=>r.high)),lo=Math.min(...rows.map(r=>r.low??r.high));
  const t0=Math.floor((lo-3)/5)*5,t1=Math.ceil((hi+3)/5)*5;
  const maxRain=Math.max(.25,...rows.map(r=>r.rain));

  const Y=v=>T+(1-(v-t0)/(t1-t0))*(H-T-B-RB);
  const RY=H-B,rH=v=>v/maxRain*(RB-6);
  const ticks=[];for(let v=t0;v<=t1;v+=Math.max(5,Math.round((t1-t0)/4/5)*5))ticks.push(v);
  const path=k=>rows.map((r,i)=>r[k]==null?"":`${i?"L":"M"}${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join("");
  const band=rows.map((r,i)=>`${i?"L":"M"}${X(i)},${Y(r.high)}`).join("")+rows.slice().reverse().map((r,j)=>`L${X(rows.length-1-j)},${Y(r.low??r.high)}`).join("")+"Z";
  const bw=Math.max(3,Math.min(14,(W-L-R)/rows.length*.6));
  const month=rows[rows.length-1].d.getMonth(),yr=rows[rows.length-1].d.getFullYear();
  const rainMonth=all.filter(r=>r.d.getMonth()===month&&r.d.getFullYear()===yr).reduce((s,r)=>s+r.rain,0);
  const U=(SET.units||"F").toUpperCase().startsWith("F")?"°F":"°C",RU=U==="°F"?'"':" mm";
  body.innerHTML=`${HIST?"":exampleTag()}
  <h3>Last ${rows.length} days · ${esc(SET.location_name||"")}${HIST?" · live":""}</h3>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily high and low temperatures with rainfall">
    ${ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`).join("")}
    <path class="band" d="${band}"/>
    <path class="hi" d="${path("high")}"/><path class="lo" d="${path("low")}"/>
    <circle cx="${X(rows.length-1)}" cy="${Y(rows[rows.length-1].high)}" r="4" style="fill:var(--title-b)"/>
    <line class="grid-l" x1="${L}" x2="${W-R}" y1="${RY}" y2="${RY}"/>
    ${rows.map((r,i)=>r.rain>0?`<rect class="rain" x="${X(i)-bw/2}" y="${RY-rH(r.rain)}" width="${bw}" height="${rH(r.rain)}"><title>${fmtDate(r.d)}: ${r.rain}${RU}</title></rect>`:"").join("")}
    <text x="${W-R+6}" y="${RY-RB+12}">${maxRain.toFixed(2)}${RU}</text><text x="${W-R+6}" y="${RY+4}">0</text>
    <text x="${L}" y="${H-6}">${fmtDate(rows[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(rows[rows.length-1].d)}</text>
  </svg>
  <div class="legend"><span><i style="background:var(--title-b)"></i>High</span><span><i style="background:#6a6488"></i>Low</span><span><i style="background:#7f97b4;height:8px;width:8px"></i>Rain</span></div>
  <div class="tbl"><table><thead><tr><th>Date</th><th>High</th><th>Low</th><th>Rain</th><th>Conditions</th><th>Notes</th></tr></thead><tbody>
  ${rows.slice().reverse().map(r=>`<tr><td>${fmtDate(r.d)}</td><td class="n">${r.high}°</td><td class="n">${r.low??"—"}°</td><td class="n">${r.rain}${RU}</td><td>${esc(r.conditions)}</td><td class="wrap">${linkify(r.notes)}</td></tr>`).join("")}
  </tbody></table></div>`;

}

    try{
      const r=await fetch("https://formsubmit.co/ajax/"+to.replace(/[^\w@.+-]/g,""),{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({email:d.email,phone:d.phone||"—",subject:d.subject||"—",message:d.message,
          _subject:"Xerophyte Labs: "+(d.subject||"new message"),_replyto:d.email,_template:"table",_captcha:"false"})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&String(j.success)!=="false"){f.reset();say("Sent! Thanks, I'll write back soon.","ok");
        const st=f.querySelector(".stamp");st.querySelector(".postmark small").textContent=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}).toUpperCase();st.classList.add("posted")}
      else if(/activat/i.test(j.message||"")){
        // FormSubmit holds messages until the owner clicks the one-time activation link it emails them
        say("Almost there: this form is waiting for a one-time activation by the site owner. Your message wasn't delivered yet, so please try again later.","err");
        if(ADMIN)msg.textContent+=" (Admin: check "+to+" for the FormSubmit email titled “Activate Form”, including spam, and click its link.)";
        return}
      else throw new Error(j.message||r.status);
    }catch(err){
      // fall back to the visitor's own mail app with everything filled in
      const q=`mailto:${to}?subject=${encodeURIComponent("Xerophyte Labs: "+(d.subject||"hello"))}&body=${encodeURIComponent(d.message+"\n\n"+d.email+(d.phone?"\n"+d.phone:""))}`;
      msg.innerHTML=`Couldn't send from here${err&&err.message&&!/^\d+$/.test(err.message)?` (${esc(err.message)})`:""}. <a href="${q}">Open it in your mail app</a> instead.`;msg.className="cmsg err";
    }finally{btn.disabled=false}
  };
}

/* the postcard's picture: a sunset over the Anza-Borrego badlands, a big saguaro, prickly pear with fruit; and a tiny stamp */
function paintPostcard(cv,st){
  if(cv){const c=cv.getContext("2d"),W=160,H=100,px=(x,y,col)=>{c.fillStyle=col;c.fillRect(x,y,1,1)},rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
    let seed=4242;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,R=(a,b)=>a+rnd()*(b-a);
    const nz=(x,f,ph)=>Math.sin(x*f+ph)*.55+Math.sin(x*f*2.3+ph*1.7)*.3+Math.sin(x*f*5.1+ph*.6)*.15;
    // sky: deep to pale blue, softly dithered, with a couple of shaded cumulus
    const sky=["#3a74c0","#4682c8","#5590d0","#689ed6","#7eaedc","#96bee2","#b0d0e8","#c8dcea"];
    for(let y=0;y<62;y++){const t=y/62*(sky.length-1),k=Math.floor(t),f=t-k;for(let x=0;x<W;x++)px(x,y,((x*3+y)%4<f*4)?sky[Math.min(sky.length-1,k+1)]:sky[k])}
    const cloud=(x0,y0,w)=>{for(let i=0;i<w;i++){const h=Math.round(3+3*Math.sin(i/w*Math.PI)+(Math.sin(i*.9)>0?1:0));for(let k=0;k<h;k++)px(x0+i,y0-k,k===h-1||k===h-2?"#ffffff":k<2?"#c8d6e6":"#eef3f8")}};
    cloud(14,16,30);cloud(98,10,36);cloud(66,26,14);
    // far ranges, hazy
    for(let x=0;x<W;x++){const y=Math.round(44+6*nz(x,.035,1));rect(x,y,1,H-y,(x+y)%3?"#9a9ac0":"#8c8cb6")}
    for(let x=0;x<W;x++){const y=Math.round(50+4*nz(x,.06,4));rect(x,y,1,H-y,(x+y)%3?"#b49aa8":"#a88e9e")}
    // the badlands: three folds of eroded mudstone hills, banded in sediment layers, gullied, lit from the left
    const bands=["#f0d8a8","#e2b47c","#d4955e","#f4e2bc","#c87e52","#e6c08a","#b86e4a","#dcae78","#f2dcb0","#c4845a"];
    const fold=(base,amp,f,ph,shift,shade)=>{const top=[];for(let x=-1;x<=W;x++)top.push(Math.round(base-amp*Math.abs(nz(x,f,ph))-amp*.35*Math.max(0,Math.sin(x*f*3.7+ph))));
      for(let x=0;x<W;x++){const y0=top[x+1],slope=top[x+2]-top[x],gully=Math.sin(x*.9+ph)*Math.sin(x*.23+ph*2)>.55;
        for(let y=y0;y<H;y++){const depth=y-y0,wav=Math.sin(x*.08+ph)*2.2+Math.sin(x*.31)*.8;
          let col=bands[((Math.floor((y+wav+shift)/2.6))%bands.length+bands.length)%bands.length];
          if(slope>0)col=mixHex(col,"#7a4a3a",.22+shade);else if(slope<0)col=mixHex(col,"#fff4dc",.12);   // sun on the left faces
          if(gully&&depth>1)col=mixHex(col,"#6a3e30",Math.min(.45,.12+depth*.03));                     // rain-cut gullies
          if(rnd()<.08)col=mixHex(col,rnd()<.5?"#fff4dc":"#5a3428",.18);                                // grit
          if(depth===0)col=mixHex(col,"#fff4dc",.25);px(x,y,col)}}};
    fold(64,14,.05,2.1,0,.05);fold(72,10,.07,4.4,5,.1);fold(80,7,.09,1.3,9,.15);
    // the wash in front: pale sand, pebbles, a few creosote bushes
    for(let y=84;y<H;y++)for(let x=0;x<W;x++)px(x,y,rnd()<.06?"#b8946a":rnd()<.1?"#f4e2bc":y<87?"#dcc08e":"#e8d0a2");
    for(let i=0;i<18;i++){const x=Math.floor(R(0,W)),y=Math.floor(R(86,H));px(x,y,"#9a7a5a");px(x+1,y,"#c4a47c")}
    const bush=(x,y)=>{for(let i=0;i<14;i++)px(x+Math.round(R(-4,4)),y-Math.round(R(0,4)),rnd()<.6?"#6e7a4a":"#4e5a34")};bush(16,90);bush(146,92);bush(98,88);
    // ocotillo: whippy grey-green canes tipped with scarlet
    const oco=(x,b,n)=>{for(let k=0;k<n;k++){const dx=(k-(n-1)/2)*1.6,len=Math.round(R(20,30));for(let t=0;t<len;t++){const X=Math.round(x+dx*t/len*3+Math.sin(t*.3+k)*.4),Y=b-t;
        px(X,Y,t%4===0?"#4a5a30":"#6a7a48");if(t>len-4)px(X,Y,t>len-2?"#ff6a3a":"#e8402a")}}};
    oco(30,98,6);oco(136,96,5);
    // teddybear cholla glowing in the light
    for(let y=82;y<95;y++)for(let i=0;i<2;i++)px(116+i,y,"#4a3a2c");
    for(let j=0;j<9;j++){const a=-Math.PI/2+(j/8-.5)*2.2,len=4+Math.round(R(0,2));for(let t=0;t<len;t++){const X=Math.round(117+Math.cos(a)*(t+1.5)),Y=Math.round(82+Math.sin(a)*(t+1.5));px(X,Y,"#e9dcab");px(X+1,Y,"#cdbd86")}}
    // wildlife: a raven overhead, a roadrunner mid-dash, a horned lizard on a sunny rock
    sprt(c,CRITTERS.ravenGlide,104,6,true,RAVENPAL);
    sprt(c,CRITTERS.run[1],64,86,false);
    rect(86,93,10,4,"#a88a6a");rect(87,92,8,1,"#c4a682");sprt(c,CRITTERS.toad,86,88,true);
  }
  if(st){const c=st.getContext("2d"),px=(x,y,col)=>{c.fillStyle=col;c.fillRect(x,y,1,1)};
    for(let y=0;y<22;y++)for(let x=0;x<30;x++)px(x,y,y>16?((x+y)%5?"#e8cc9a":"#d4b07a"):y>13?"#f4dcae":"#fbe9cc");   // pale desert morning
    for(let y=0;y<5;y++)for(let x=0;x<5;x++)if((x-2)**2+(y-2)**2<6)px(23+x,2+y,"#f2b85a");
    sprt(c,CRITTERS.run[0],5,7,false)}
}

/* ---------- build desktop ---------- */
function iconBtn(id,label,icon,badge){
  const b=document.createElement("button");b.className="icon";
  b.innerHTML=`<span class="badge"><img alt="" src="${sprite(icon)}">${badge?`<i>${badge}</i>`:""}</span><span>${esc(label)}</span>`;
  b.dataset.win=id;b.onclick=()=>openWin(id);return b;
}
function build(){
  document.getElementById("windows").innerHTML="";for(const k in WINS)delete WINS[k];openOrder=0;
  const L=document.getElementById("iconsLeft"),R=document.getElementById("iconsRight");L.innerHTML=R.innerHTML="";
  const t=[SET.title_line_1,SET.title_line_2,SET.title_line_3].filter(Boolean);
  // every character gets a fixed cell so the right-aligned title never shifts while it types
  const h1=document.getElementById("title");h1.setAttribute("aria-label",t.join(" "));
  h1.innerHTML=t.map((s,i)=>`<span aria-hidden="true">${[...s].map((ch,j)=>`<i class="ch${j===s.length-1?" eol":""}">${esc(ch)}</i>`).join("")}${i===t.length-1?'<b class="cursor"></b>':''}</span>`).join("");
  typeTitle();
  document.getElementById("tagline").textContent=SET.tagline||"";
  document.title=t.join(" ").replace(/,/g,"")||"Xerophyte Labs";
  const words=(SET.marquee||"Always under construction").split("|").map(s=>s.trim()).filter(Boolean);
  // Settings › show_marquee: "no", "off", "false", "hide" or "0" hides the scrolling banner
  document.querySelector(".marquee").hidden=/^(no|off|false|hide|hidden|0)$/i.test(String(SET.show_marquee||"").trim());
  document.body.classList.toggle("noMarquee",document.querySelector(".marquee").hidden);
  const run=words.join(" · ")+" · ";document.getElementById("marquee").textContent=(run.repeat(Math.ceil(30/words.length))).repeat(2);
  document.getElementById("startside").textContent=SET.start_label||"Xerophyte Labs";

  const mob=isMob(),cx=w=>Math.max(130,(innerWidth-w)/2);
  defineWindow("cacti",{title:"My Cacti",icon:"saguaro",w:640,x:mob?16:120,y:84,render:renderCacti,menu:["File","View","Water"],status:true});
  defineWindow("map",{title:"Desert Map",icon:"map",w:Math.min(860,innerWidth-40),x:mob?16:Math.max(110,(innerWidth-860)/2),y:70,render:renderMap,status:true});
  defineWindow("radio",{title:radioName(),icon:"radio",w:380,x:innerWidth-595,y:64,render:renderRadio,status:true});
  defineWindow("today",{title:"Weather Now",icon:"sunthermo",w:420,x:innerWidth-560,y:96,render:renderToday,status:true});
  defineWindow("bio",{title:"Biodiversity Report",icon:"journal",w:660,x:cx(660),y:100,render:renderBio,menu:["File","Survey","Help"],status:true});
  defineWindow("log",{title:"Weather Log",icon:"hilo",w:640,x:cx(640),y:110,render:renderLog,menu:["File","Edit","Chart"],status:true});
  const thirsty=(DATA.cacti||[]).filter(c=>c.name&&cactusState(c).status==="thirsty").length;
  HIDE_WILD=new Set((DATA.wildlife||[]).filter(r=>isNo(r.show)).map(r=>String(r.animal||"").trim().toLowerCase()));
  // a count column changes how many creatures there are, so repaint the scene with the sheet's numbers
  const sig=JSON.stringify((DATA.wildlife||[]).map(r=>[r.animal,r.count]));if(sig!==build.wildSig){const first=build.wildSig===undefined;build.wildSig=sig;
    if(SCENE.ctx&&(!first||(DATA.wildlife||[]).some(r=>String(r.count??"").trim()!=="")))paintSky()}
  // Desktop tab: show = no hides an icon (and its Start menu entry); label renames it
  const HIDDEN=new Set(),ICONS=[];
  const place=(col,id,label,icon,badge)=>{const r=deskRow(id,label);if(r&&isNo(r.show)){HIDDEN.add(id);return}
    // the radio is always named by Settings › radio_title; a Desktop label only applies when that is blank
    const lab=id==="radio"&&String(SET.radio_title||"").trim()?"":r&&r.label;
    const name=lab||label;if(WINS[id]&&lab){WINS[id].title=lab;WINS[id].el.querySelector(".bar b").textContent=lab;WINS[id].el.setAttribute("aria-label",lab)}
    ICONS.push({id,name,el:iconBtn(id,name,icon,badge)})};
  place(L,"cacti","My Cacti","saguaro",thirsty||"");place(L,"log","Weather Log","hilo");
  place(L,"today","Weather Now","sunthermo");place(L,"bio","Biodiversity Report","journal");place(L,"map","Desert Map","map");place(L,"radio",radioName(),"radio");
  (DATA.pages||[]).filter(p=>p.title).forEach((p,i)=>{
    const pic=/^contact/i.test(String(p.title).trim())?"postcard":/^about/i.test(String(p.title).trim())?"campfire":/^field\s*notes/i.test(String(p.title).trim())?"binoculars":(p.icon||"folder").toLowerCase();
    const id="p"+i;defineWindow(id,{title:p.title,icon:pic,w:pic==="postcard"?760:440,x:mob?16:140+i*30,y:120+i*24,render:renderPage(p)});
    place(L,id,p.title,pic);
  });
  // icons run alphabetically: down the left column, then down the right (one grid on phones)
  ICONS.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
  const half=Math.ceil(ICONS.length/2);
  ICONS.forEach((ic,i)=>{(mob||i<half?L:R).append(ic.el);
    if(ic.id==="radio"){const tt=document.createElement("div");tt.className="turntable";tt.id="turntable";tt.title="Now spinning";
    tt.innerHTML='<canvas width="64" height="56" aria-hidden="true"></canvas><img class="deck-art" alt="" hidden><i class="deck-pin"></i>';tt.onclick=()=>openWin("radio");if(DECK.art){const im=tt.querySelector(".deck-art");im.src=DECK.artSrc;im.hidden=false}(mob||i<half?L:R).append(tt);if(!mob&&i<half)tt.classList.add("fromLeft");spinDeck()}});
  // warm up the Spotify player API in the background so the radio and disco start fast
  if(spotifySrc(SET.spotify_url||SET.spotify_playlist))setTimeout(preloadSpotify,1200);
  // start menu
  const ul=document.getElementById("startlist");ul.innerHTML="";
  Object.entries(WINS).filter(([id])=>!HIDDEN.has(id)).forEach(([id,w])=>{const li=document.createElement("li");li.innerHTML=`<button><img alt="" src="${sprite(w.icon)}">${esc(w.title)}</button>`;li.firstChild.onclick=()=>{toggleStart(false);openWin(id)};ul.appendChild(li)});
  ul.insertAdjacentHTML("beforeend",'<hr class="adm">');
  // sheet tools only show in admin mode; the check says whether the site is reading the sheet
  const mark=SHEET_STATE==="ok"?'<span class="chk ok" title="Reading the sheet">✓</span>':SHEET_STATE==="partial"?'<span class="chk warn" title="Some tabs could not be read">!</span>':'<span class="chk off" title="Showing sample data">✗</span>';
  const rl=document.createElement("li");rl.className="adm";rl.innerHTML=`<button><img alt="" src="${sprite("globe")}">Refresh from sheet${mark}</button>`;rl.firstChild.onclick=()=>{toggleStart(false);boot(true)};ul.appendChild(rl);
  if(CONFIG.SHEET_ID){const ed=document.createElement("li");ed.className="adm";ed.innerHTML=`<a href="https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit" target="_blank" rel="noopener"><img alt="" src="${sprite("book")}">Open the sheet</a>`;ul.appendChild(ed)}
  updateTray();fitIcons();
}
// phones: shrink the icon grid just enough that it never runs into the title block at the bottom right
function fitIcons(){
  const nav=document.getElementById("iconsLeft"),hero=document.querySelector(".hero");if(!nav||!hero)return;
  const land=isMob()&&innerWidth>innerHeight;document.body.classList.toggle("landicons",land);
  if(!land)nav.style.height="";
  if(!isMob()){nav.style.removeProperty("--k");nav.style.width="";nav.style.top="";const mq=document.querySelector(".marquee");if(mq)mq.style.top="";return}
  if(land){
    // phone on its side: the icons stack in columns down the upper-right corner, and the title + marquee keep to the left of them
    const safeTop=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat"))||0;
    nav.style.top=(8+safeTop)+"px";
    const bar=document.querySelector(".taskbar").getBoundingClientRect().top,room=bar-8-(8+safeTop),icons=[...nav.querySelectorAll(".icon")].filter(i=>i.offsetParent!==null||!i.hidden);
    for(let k=1;k>=.6;k=Math.round((k-.05)*100)/100){nav.style.setProperty("--k",k);nav.style.height=room+"px";
      const ih=Math.max(1,...icons.map(i=>i.offsetHeight))+6*k,per=Math.max(1,Math.floor(room/ih)),cols=Math.ceil(icons.length/per),wd=cols*(78*k+4);
      nav.style.width=wd+"px";document.body.style.setProperty("--iconsW",wd+"px");
      if(wd<=innerWidth*.42)break}
    const mq=document.querySelector(".marquee"),hb=hero.getBoundingClientRect().bottom;if(mq)mq.style.top=Math.round(hb+8)+"px";
    return}
  // phones: title on top, then the marquee (if shown), then the icons, which must stop above the taskbar
  const mq=document.querySelector(".marquee"),hb=hero.getBoundingClientRect().bottom;
  if(mq)mq.style.top=Math.round(hb+8)+"px";
  nav.style.top=Math.round((mq&&!mq.hidden?mq.getBoundingClientRect().bottom:hb)+10)+"px";
  const bar=document.querySelector(".taskbar").getBoundingClientRect().top;
  const room=()=>bar-8-nav.getBoundingClientRect().top;
  const used=()=>{let b=0;nav.querySelectorAll(".icon").forEach(i=>{b=Math.max(b,i.getBoundingClientRect().bottom)});return b-nav.getBoundingClientRect().top};
  const set=(cols,k)=>{nav.style.setProperty("--k",k);nav.style.width=Math.min(innerWidth-24,cols*(78*k+4))+"px"};
  // prefer two right-hand columns at full size; shrink a little, then add a column, before shrinking further
  for(const [cols,kMin] of [[2,.82],[3,.5]]){
    for(let k=1;k>=kMin-.001;k=Math.round((k-.04)*100)/100){set(cols,k);if(used()<=room())return}
  }
}
addEventListener("resize",()=>{clearTimeout(fitIcons.t);fitIcons.t=setTimeout(fitIcons,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitIcons());
function typeTitle(){
  const h=document.getElementById("title"),chars=[...h.querySelectorAll(".ch")];
  clearTimeout(typeTitle.t);
  if(document.body.classList.contains("still")){chars.forEach(c=>c.className="ch on");h.classList.remove("typing");return}
  chars.forEach(c=>c.classList.remove("on","caret"));h.classList.add("typing");
  let i=0;
  const step=()=>{
    if(i>0){chars[i-1].classList.remove("caret");chars[i-1].classList.add("on")}
    if(i<chars.length){chars[i].classList.add("caret");const eol=i>0&&chars[i-1].classList.contains("eol");i++;
      typeTitle.t=setTimeout(step,(eol?220:0)+38+Math.random()*52)}
    else{h.classList.remove("typing");typeTitle.t=setTimeout(neonTagline,250)}
  };
  typeTitle.t=setTimeout(step,450);
}
function neonTagline(){
  const t=document.getElementById("tagline");if(!t||document.body.classList.contains("still"))return;
  t.classList.remove("neon");void t.offsetWidth;t.classList.add("neon");
}
function updateTray(){

  const ll=document.getElementById("liveLine");
  if(LIVE&&LIVE.current){const c=LIVE.current,F=(SET.units||"F").toUpperCase().startsWith("F");
    ll.innerHTML=`<img class="wx" src="${wxIcon(c.weather_code,SCENE.night)}" alt="${esc(WMO[c.weather_code]??"")}" title="${esc(SET.location_name||"")}"><span>${Math.round(c.temperature_2m)}° · ${esc(WMO[c.weather_code]??"")} · wind ${Math.round(c.wind_speed_10m)} ${F?"mph":"km/h"}</span>`;ll.hidden=false}
  else ll.hidden=true;
  if(typeof fitIcons==="function")requestAnimationFrame(fitIcons);   // the live line changes the title block's height
}
function tick(){if(SCENE.override==null&&isNightNow()!==SCENE.night)setNight(!SCENE.night);const d=new Date();document.getElementById("clock").textContent=d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}).toLowerCase().replace(" ","")}
function toggleStart(force){const m=document.getElementById("startmenu"),b=document.getElementById("startbtn");const on=force??m.hidden;m.hidden=!on;b.setAttribute("aria-expanded",on)}
document.getElementById("startbtn").onclick=e=>{e.stopPropagation();toggleStart()};
document.addEventListener("click",e=>{if(!e.target.closest("#startmenu"))toggleStart(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){toggleStart(false);const a=Object.keys(WINS).find(k=>WINS[k].el.classList.contains("active")&&WINS[k].open);if(a)closeWin(a)}});

async function boot(refresh){
  const wasOpen=refresh?Object.keys(WINS).filter(k=>WINS[k].open&&!WINS[k].min):[];
  await loadAll();build();
  wasOpen.forEach(openWin);
  [LIVE,HIST]=await Promise.all([loadLive(),loadHistory()]);updateTray();
  ["today","log"].forEach(id=>{if(WINS[id].open&&!WINS[id].min)openWin(id)});
  if(!refresh&&!boot.timer)boot.timer=setInterval(async()=>{LIVE=await loadLive()||LIVE;HIST=await loadHistory()||HIST;updateTray();if(WINS.today.open&&!WINS.today.min)openWin("today")},15*60e3);
}
const hashMode=(location.hash||"").slice(1).toLowerCase();
if(hashMode==="night"||hashMode==="day")SCENE.override=hashMode==="night";
SCENE.motion=motionPref();setMotion(SCENE.motion,false);
setNight(SCENE.override??isNightNow());
// favicon: the beavertail prickly pear specimen, scaled up crisply
(()=>{const src=document.createElement("canvas");src.width=src.height=24;drawSpecimen(src.getContext("2d"),"opuntia");
  const cv=document.createElement("canvas");cv.width=cv.height=48;const x=cv.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(src,0,0,48,48);
  document.getElementById("favicon").href=cv.toDataURL("image/png")})();
setDisco(false);
document.getElementById("discobtn").onclick=()=>setDisco(!SCENE.disco,true);
tick();setInterval(tick,30000);
document.getElementById("modebtn").onclick=()=>{SCENE.override=!SCENE.night;setNight(SCENE.override)};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(SCENE.disco&&isMob())setDisco(false);paintSky()},150)});
document.body.classList.toggle("admin",ADMIN);boot();
</script>
